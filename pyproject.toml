[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmark"
version = "0.1.0"
description = "Configurable optical MCQ marking and class analytics"
requires-python = ">=3.9"
dependencies = ["numpy", "opencv-python-headless", "Pillow", "pymupdf", "pytesseract", "Flask>=3.0,<4", "waitress>=3,<4", "Authlib>=1.6,<2", "requests>=2.32,<3", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]

[project.scripts]
mcmark = "mcmark.cli:main"
mc-killer = "mcmark.web:main"

[tool.setuptools.packages.find]
include = ["mcmark*"]

[tool.setuptools.package-data]
mcmark = ["*.swift", "templates/*.html", "static/*", "layouts/*"]
